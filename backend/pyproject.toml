[project]
name = "eqr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GPoet", email = "grindingpoet@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.17.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
    "yfinance>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
