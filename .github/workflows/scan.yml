name: daily-scan
on:
  schedule:
    - cron: "45 14 * * 1-5" # 20:15 IST, after NSE publishes the day's file
    - cron: "15 21 * * *" # 02:45 IST, resumes an unfinished scan
    - cron: "15 4 * * *" # 09:45 IST, resumes again
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: Minutes each job scans before saving and deploying
        default: "280"
concurrency:
  group: scan
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # Eight jobs in parallel, each on its own runner (its own IP), each scanning one slice of the
  # companies at the polite per-address rate: about 8x faster than one job.
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Restore shared scan data
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: eqr-data-none
          restore-keys: eqr-data-
      - name: Install backend
        working-directory: backend
        run: uv sync --frozen
      - name: Scan this slice
        working-directory: backend
        env:
          BUDGET: ${{ inputs.budget_minutes || '280' }}
          SHARD: ${{ matrix.shard }}
        run: |
          [[ "$BUDGET" =~ ^[0-9]{1,3}$ ]] || BUDGET=280
          uv run python scripts/run_scan.py --budget-minutes "$BUDGET" --shard "$SHARD/8" --delta-out "$RUNNER_TEMP/delta"
      - name: Upload this slice's additions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-${{ matrix.shard }}
          path: ${{ runner.temp }}/delta
          retention-days: 2
          if-no-files-found: ignore

  publish:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore shared scan data
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: eqr-data-none
          restore-keys: eqr-data-
      - name: Collect slices
        uses: actions/download-artifact@v4
        with:
          pattern: delta-*
          path: ${{ runner.temp }}/deltas
      - name: Install backend
        working-directory: backend
        run: uv sync --frozen
      - name: Merge slices
        working-directory: backend
        run: uv run python scripts/merge_shards.py "$RUNNER_TEMP"/deltas/*
      - name: Save shared scan data
        uses: actions/cache/save@v4
        with:
          path: backend/data
          key: eqr-data-${{ github.run_id }}
      - name: Export site data
        working-directory: backend
        run: uv run python scripts/export_site.py
      - name: Build static site
        working-directory: frontend
        env:
          NEXT_PUBLIC_STATIC: "1"
        run: npm ci && npm run build
      - name: Deploy to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
        run: npx --yes wrangler@3 pages deploy out --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
