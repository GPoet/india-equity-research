name: research
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: NSE symbol
        required: true
concurrency:
  group: research-${{ inputs.symbol }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYMBOL: ${{ inputs.symbol }}
    steps:
      - name: Check symbol
        run: '[[ "$SYMBOL" =~ ^[A-Z0-9\&_-]{1,24}$ ]] || { echo "bad symbol"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Restore scan data (read only)
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: eqr-data-none
          restore-keys: eqr-data-
      - name: Install backend
        working-directory: backend
        run: uv sync --frozen
      - name: Research
        working-directory: backend
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run python scripts/research_job.py "$SYMBOL" --out result.json
      - name: Store result for the site
        if: always()
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEARCH_KV_ID: ${{ secrets.RESEARCH_KV_ID }}
        run: |
          [ -f result.json ] || echo '{"status":"failed","error":"The research job stopped before finishing","kind":"internal"}' > result.json
          python3 scripts/kv_put.py "$SYMBOL" result.json
